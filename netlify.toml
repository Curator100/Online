[build]
  publish = "."

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Single-page app: send unknown paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
